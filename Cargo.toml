[package]
name = "divoom-export"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Synchronize personal Divoom playlists and export 16x16 artwork as lossless animated WebP"
license = "MIT"
publish = false

[lib]
name = "divoom_export"
path = "src/lib.rs"

[[bin]]
name = "divoom-export"
path = "src/main.rs"

[dependencies]
aes = "0.8"
anyhow = "1"
cbc = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
lzo = "0.1.4"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
webp-animation = "0.10"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
